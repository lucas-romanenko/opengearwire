# Tests on three Pythons and the lint, for every push and pull request.
# The suite needs no hardware: a fake frame replays a sanitized capture.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install editable with the test extras
        run: pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  build:
    name: sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: The wheel installs and the CLI runs
        run: |
          pip install dist/*.whl
          cd /tmp && python -c "import opengearwire; print(opengearwire.__version__)" && opengearwire --help

  # One check with a fixed name for branch protection to require.
  result:
    name: CI result
    needs: [test, lint, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          TESTS: ${{ needs.test.result }}
          LINT: ${{ needs.lint.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "tests=$TESTS lint=$LINT build=$BUILD"
          test "$TESTS" = "success" && test "$LINT" = "success" && test "$BUILD" = "success"
